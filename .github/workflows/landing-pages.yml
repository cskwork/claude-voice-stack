# Publishes landing/ to GitHub Pages. Enable Pages with "GitHub Actions" as the
# source first (Settings → Pages); private repositories need a paid plan.
name: landing-pages
on:
  push:
    branches: [main]
    paths: ['landing/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: landing
      - id: deployment
        uses: actions/deploy-pages@v5
